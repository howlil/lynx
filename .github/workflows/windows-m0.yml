name: LYNX Native CI
on:
  push:
    branches: [master, "feat/m0-native-shell", "feat/m1-activity-core", "feat/m2-windows-providers", "feat/m3-general-utilities"]
  pull_request:
jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows feasibility executable
        uses: actions/upload-artifact@v4
        with:
          name: lynx-native-windows-x64
          path: build/Release/lynx_m0.exe
          if-no-files-found: error
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
