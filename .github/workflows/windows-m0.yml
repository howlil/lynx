name: LYNX Native CI
on:
  push:
    branches: [master, "feat/m0-native-shell", "feat/m1-activity-core", "feat/m2-windows-providers", "feat/m3-general-utilities", "feat/m4-runtime-hardening", "feat/m4b-render-accessibility", "feat/m4c-composition-probe", "feat/m5-html-v3-parity"]
  pull_request:
jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Verify runtime sampler PowerShell parses
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/measure-runtime.ps1),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate renderer comparison harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/compare-render-metrics.ps1),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $fixture = Join-Path $env:RUNNER_TEMP 'lynx-fixture.csv'
          @(
            'renderer,total_draw_calls,failed_draw_calls,mean_cpu_ms,p95_recent_cpu_ms,max_cpu_ms,recent_window'
            'layered_gdiplus,100,0,0.8000,1.3000,2.4000,100'
          ) | Set-Content -Path $fixture
          & ./scripts/compare-render-metrics.ps1 -Baseline $fixture -Candidate $fixture
          if ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0) { exit 1 }
      - name: Composition path geometry self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path .\build\Release\lynx_composition_probe.exe) -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Composition geometry test returned $($p.ExitCode)" }
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows feasibility executable
        uses: actions/upload-artifact@v4
        with:
          name: lynx-native-windows-x64
          path: build/Release/lynx_m0.exe
          if-no-files-found: error
      - name: Upload composition candidate A executable
        uses: actions/upload-artifact@v4
        with:
          name: lynx-composition-probe-windows-x64
          path: build/Release/lynx_composition_probe.exe
          if-no-files-found: error
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
